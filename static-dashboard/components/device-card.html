<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tank Device Card</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6 flex justify-center">

<div class="bg-white rounded-2xl shadow-lg p-5 w-[460px]">

  <!-- HEADER -->
  <div class="flex justify-between items-start mb-4">
    <div>
      <h2 class="text-lg font-bold text-gray-800">TANK - 001</h2>
      <p class="text-sm text-gray-500">Analyzer - 001</p>
    </div>

    <div >
        <span  class="text-xs text-center pr-1">Device Status: </span>
        <span id="statusBadge"
        class="text-xs px-3 py-1 rounded-full bg-green-100 text-green-600">
        Online
        </span>
        <div class="text-xs text-gray-400 pt-1 text-right">
        Last update: <span id="lastUpdate">--:--:--</span>
        </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="flex gap-4">

    <!-- LEFT: SVG TANK (ASLI KAMU) -->
    <div class="w-[180px] flex justify-center">
      <svg width="160" viewBox="0 0 157 297">

        <!-- === SVG KAMU (TIDAK DIUBAH) === -->
        <rect width="12.2717" height="59.0666"
          transform="matrix(0.547911 0.836537 -0.870529 0.492118 72.4192 235)"
          fill="url(#paint0_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect width="12.2717" height="59.0666"
          transform="matrix(0.455856 -0.890054 0.858388 0.513001 78 243.922)"
          fill="url(#paint1_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect x="1" y="40" width="155" height="171"
          fill="url(#paint2_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect x="1" y="32" width="155" height="10"
          fill="url(#paint3_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect x="19" y="232" width="16" height="58"
          fill="url(#paint4_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect x="7" y="284" width="39" height="12"
          fill="url(#paint5_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect x="123" y="232" width="15" height="58"
          fill="url(#paint6_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <path d="M77.1327 250C110.542 250 156 237.338 156 219L1 219C1 236.465 43.7236 250 77.1327 250Z"
          fill="url(#paint7_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <path d="M79.8673 1C46.4582 0.99986 1 13.662 1 32L156 32C156 14.5352 113.276 1.00014 79.8673 1Z"
          fill="url(#paint8_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect x="114" y="284" width="36" height="12"
          fill="url(#paint9_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <rect x="1" y="209" width="155" height="10"
          fill="url(#paint10_linear)" stroke="#5E5E5E" stroke-width="1"/>

        <!-- sight glass -->
        <rect x="104" y="43" width="27" height="165"
          fill="#F9F9F9" stroke="#5E5E5E" stroke-width="1"/>

        <!-- LEVEL -->
        <rect id="levelBar"
        x="105"
        y="200"
        width="25"
        height="0"
        fill="#4FACEE"/>

        <line x1="105" y1="43.5" x2="113" y2="43.5" stroke="#FF0000"/>
        <line x1="105" y1="207.5" x2="113" y2="207.5" stroke="#FF0000"/>
        <line x1="105" y1="125.5" x2="113" y2="125.5" stroke="#FF0000"/>
        <line x1="105" y1="166.5" x2="113" y2="166.5" stroke="#FF0000"/>
        <line x1="105" y1="84.5" x2="113" y2="84.5" stroke="#FF0000"/>

        <circle cx="112" cy="190" r="3" fill="rgba(255,255,255,0.4)"/>
        <circle cx="123" cy="170" r="2" fill="rgba(255,255,255,0.4)" />
        <circle cx="115" cy="150" r="4" fill="rgba(255,255,255,0.4)" />

        <!-- TEXT -->
        <text id="percentText"
              x="60"
              y="130"
              text-anchor="middle"
              font-size="18"
              font-weight="bold"
              fill="#1f2937">
          50%
        </text>

        <!-- GRADIENT -->
        <defs>
          <linearGradient id="paint0_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint1_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint2_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint3_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint4_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint5_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint6_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint7_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint8_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint9_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
          <linearGradient id="paint10_linear"><stop stop-color="#939393"/><stop offset="0.5" stop-color="#F9F9F9"/><stop offset="1" stop-color="#939393"/></linearGradient>
        </defs>

      </svg>
    </div>

    <!-- RIGHT: PARAMETER (UPGRADE JADI MINI CARD) -->
    <div class="flex-1 grid grid-cols-1 gap-3 px-2">

      <!-- pH -->
      <div class="bg-gray-50 dark:bg-gray-800 rounded-lg shadow-md px-3 py-2">
        <div class="flex justify-between items-center">
          <h3 class="text-md font-semibold text-gray-700 dark:text-gray-200 mb-1">pH Level</h3>
          <div class="p-1.5 rounded-full bg-blue-100 dark:bg-blue-900">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-droplet text-blue-500 dark:text-blue-300"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
          </div>
        </div>
        <div class="text-lg font-bold text-gray-800 dark:text-white "><span id="ph-value">8.2</span></div>
        <span class="text-gray-500 text-xs dark:text-gray-400">Range: 6.5 - 8.5</span>
      </div>

      <!-- Turbidity -->
      <div class="bg-gray-50 dark:bg-gray-800 rounded-lg shadow-md px-3 py-2">
        <div class="flex justify-between items-center">
          <h3 class="text-md font-semibold text-gray-700 dark:text-gray-200 mb-1">Turbidity</h3>
          <div class="p-1.5 rounded-full bg-blue-100 dark:bg-blue-900">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-cloud text-purple-500 dark:text-purple-300"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>
          </div>
        </div>
        <div class="text-lg font-bold text-gray-800 dark:text-white "><span id="ph-value">3.8 NTU</span></div>
        <span class="text-gray-500 text-xs dark:text-gray-400">Target: &lt;5 NTU</span>
      </div>

      <!-- Usage Today & Monthly-->
      <div class="bg-gray-50 dark:bg-gray-800 rounded-lg shadow-md px-3 py-2">
        <div class="flex justify-between items-center mb-1">
          <h3 class="text-md font-semibold text-gray-700 dark:text-gray-200">Water Usage</h3>
          <div class="p-1.5 rounded-full bg-green-100 dark:bg-green-900">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-activity text-green-500 dark:text-green-300"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          </div>
        </div>
        <div class="flex justify-between items-end mb-2">
          <div>
            <div class="text-sm text-gray-500 dark:text-gray-400">Today</div>
            <div class="text-lg font-bold text-gray-800 dark:text-white"><span id="water-usage-value">1,364</span> L</div>
          </div>
          <div class="text-right">
            <div class="text-sm text-gray-500 dark:text-gray-400">This Month</div>
            <div class="text-lg font-bold text-gray-800 dark:text-white"><span id="water-usage-monthly-value">22,5</span> KL</div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="mt-4 flex justify-between items-center px-2">

    <!-- DEVICE ALARM (BARU) -->
    <div class="text-xs text-gray-500">
      Alarm Active :
      <span id="alarmCount" class="font-semibold text-gray-700">N/A</span>
    </div>

    <button class="bg-blue-500 hover:bg-blue-600 text-white text-sm px-4 py-1.5 rounded-lg">
      Device Detail
    </button>

  </div>

</div>

<script>
const levelBar = document.getElementById("levelBar");
const text = document.getElementById("percentText");

function updateLevel(val){
  const maxHeight = 165;
  const bottomY = 208;

  let h = (val/100) * maxHeight;
  let y = bottomY - h;

  levelBar.setAttribute("height", h);
  levelBar.setAttribute("y", y);
  text.textContent = val + "%";
}

// simulasi
setInterval(()=>{
  let val = Math.floor(Math.random()*100);
  updateLevel(val);

  document.getElementById("lastUpdate").innerText =
    new Date().toLocaleTimeString();

},3000);

updateLevel(50);
</script>

</body>
</html>
