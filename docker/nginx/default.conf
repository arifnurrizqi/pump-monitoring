map $http_x_forwarded_proto $hydroflow_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $hydroflow_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_upgrade $hydroflow_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Browser WebSocket endpoint. Reverb remains private inside the Docker network.
    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $hydroflow_forwarded_host;
        proxy_set_header X-Forwarded-Proto $hydroflow_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hydroflow_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_pass http://reverb:8080;
    }

    # Public MQTT over WebSocket endpoint. TLS is terminated by Cloudflare;
    # Mosquitto only receives the proxied WebSocket traffic internally.
    location = /mqtt {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $hydroflow_forwarded_host;
        proxy_set_header X-Forwarded-Proto $hydroflow_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hydroflow_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://mqtt:9001;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $hydroflow_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $hydroflow_forwarded_host;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }
    location ~ /\. { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
